<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8ed6ff" />
    <title>ANIMAL BONK!</title>
    <!-- YouTube requires its SDK to be loaded before any game code. -->
    <script src="https://www.youtube.com/game_api/v1"></script>
  </head>
  <body>
    <main id="game" aria-label="Animal Bonk game">
      <div id="loading" role="status">BUILDING THE BONK…</div>
      <section id="hud" aria-live="polite">
        <div class="topbar"><span class="brand">ANIMAL <b>BONK!</b></span><span id="level">LEVEL 1</span><span id="score">SCORE 0</span></div>
        <div id="debug" hidden></div>
        <div id="message"><strong>TAP THE PIG</strong><small>Aim for different body parts</small></div>
        <div id="combo"></div>
        <button id="restart" type="button" aria-label="Restart level">↻ RESTART</button>
        <div id="impact-layer"></div>
        <div id="level-complete" hidden></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
